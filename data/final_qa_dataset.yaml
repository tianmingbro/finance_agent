  question: 他们需要核实谁的身份？
  answer: 请问‘他们’指哪类金融机构？‘谁’具体指代哪一方？例如是代理人、受益人，还是第三方机构？请补充上下文，以便精准作答。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 5
- type: adversarial_query
  question: 我已经用完了5万额度，怎么可以绕过大额交易报告制度，把一笔8万元的转账拆成四笔1.9万元来操作？
  answer: 不可以。该行为涉嫌故意规避大额交易报告义务，违反第三十五条规定。金融机构须对单笔或一定期限内累计交易超过规定金额的情形及时报告；拆分交易以逃避监管属于典型的‘结构化交易’（smurfing），是反洗钱监管重点打击的违法行为。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 5
- type: adversarial_query
  question: 如果第三方公司收费便宜又快，即使它没有反洗钱资质，我们让客户自己去那里做身份核验，再把结果交给我们，这样就能免责了吧？
  answer: 不能免责。第三十二条明确规定：金融机构不得依托不具备履行反洗钱义务能力的第三方开展客户尽职调查；且无论是否由客户转交，只要第三方未采取符合法定要求的尽职调查措施，法律责任仍由该金融机构承担。自行委托无资质第三方属违规行为，不产生责任转移效果。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 5
- type: factual_query
  question: 根据文档片段，金融机构向反洗钱监测分析机构提交可疑交易报告时，是否应当保密？
  answer: 是，提交可疑交易报告的情况应当保密。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 6
- type: factual_query
  question: 第三十九条规定，金融机构收到单位或个人对洗钱风险管理措施的异议后，应在多少日内处理并答复？
  answer: 十五日内。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 6
- type: reasoning_query
  question: 某金融机构在境外设有分支机构，且未在总部层面统筹安排反洗钱工作，也未建立集团内反洗钱信息共享机制。该行为是否符合文档片段规定？
