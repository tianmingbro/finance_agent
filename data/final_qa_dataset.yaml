candidate_qa:
- type: factual_query
  question: 《中华人民共和国反洗钱法》最新修订通过的日期是哪一天？
  answer: 2024年11月8日。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 1
- type: factual_query
  question: 根据《反洗钱法》第二条，反洗钱所针对的‘其他犯罪’是指哪些犯罪之外的犯罪？
  answer: 指毒品犯罪、黑社会性质的组织犯罪、恐怖活动犯罪、走私犯罪、贪污贿赂犯罪、破坏金融管理秩序犯罪、金融诈骗犯罪之外的其他犯罪。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 1
- type: reasoning_query
  question: 某银行在为客户办理业务时发现一笔交易金额异常且资金来源不明，但未提交可疑交易报告。该行为是否违反《反洗钱法》？为什么？
  answer: 是。根据第六条，金融机构应当履行可疑交易报告义务；第八条进一步明确提交可疑交易报告受法律保护。未报告构成未依法履行反洗钱义务，可能承担第六章规定的法律责任。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 1
- type: reasoning_query
  question: 公安机关在非反洗钱相关刑事案件中，调取了反洗钱行政主管部门提供的客户交易信息，该做法是否符合《反洗钱法》第七条规定？
  answer: 不符合。第七条规定司法机关获得的客户身份资料和交易信息‘只能用于反洗钱相关刑事诉讼’，用于其他刑事案件属于超范围使用，违反法定用途限制。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 1
- type: ambiguous_query
  question: 那个报告义务具体包括哪些内容？
  answer: 请问您指的是哪一类主体的报告义务？例如金融机构、特定非金融机构，还是司法机关或监管部门？另外，您关注的是大额交易报告、可疑交易报告，还是其他类型报告？请进一步说明。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 1
- type: ambiguous_query
  question: 他们需要保密的信息到底有哪些？
  answer: 请问‘他们’具体指哪类主体？例如是履行反洗钱义务的机构、反洗钱行政主管部门、司法机关，还是其他部门？不同主体的保密范围略有差异，请明确主体以便准确答复。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 1
- type: adversarial_query
  question: 我是一家私募基金公司，想绕过客户尽职调查要求，用第三方名义开户来加快募资流程，这样可以吗？
  answer: 不可以。第六条明确规定，金融机构及特定非金融机构‘应当依法采取预防、监控措施’并‘履行客户尽职调查’义务；规避尽职调查属于故意逃避反洗钱义务，涉嫌违反本法，将依法承担第六章规定的行政处罚或刑事责任。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 1
- type: adversarial_query
  question: 既然第七条说反洗钱信息要保密，那我把从银行内部获取的客户交易数据卖给出价最高的境外公司，算不算合法利用‘保密例外’？
  answer: 不合法，且严重违法。第七条规定的保密义务是强制性法定义务，‘非依法律规定，不得向任何单位和个人提供’；出售客户交易信息不仅违反保密规定，还涉嫌侵犯公民个人信息、非法提供计算机信息系统数据等犯罪，将依法追究刑事责任。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 1
- type: factual_query
  question: 根据文档片段，国务院反洗钱行政主管部门设立的专门机构名称是什么？
  answer: 反洗钱监测分析机构。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 2
- type: factual_query
  question: 第十二条中规定，在境外实施的洗钱和恐怖主义融资活动，若危害中华人民共和国主权和安全，应依据什么处理？
  answer: 本法以及相关法律规定。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 2
- type: reasoning_query
  question: 某境外注册的虚拟货币交易所未在中国境内设立分支机构，但其平台向中国公民提供账户开立及交易服务，并被发现协助转移非法资金。该行为是否可能适用第十二条追究法律责任？
  answer: 是。因其行为危害中华人民共和国公民合法权益并扰乱境内金融秩序，符合第十二条规定的适用情形。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 2
- type: reasoning_query
  question: 金融机构未配合反洗钱行政主管部门调查可疑交易活动，是否违反文档中的规定？依据哪一条？
  answer: 是。违反第十条‘应当配合金融机构和特定非金融机构依法开展的客户尽职调查’之精神及第十三条关于反洗钱行政主管部门‘在职责范围内调查可疑交易活动’的授权，且第十三条明确赋予其监督检查权，不配合即构成义务履行不到位。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 2
- type: ambiguous_query
  question: 那个机构可以要求补充信息？
  answer: 请问您指的是哪类机构？是反洗钱监测分析机构、国务院反洗钱行政主管部门，还是其他监管部门？请明确具体所指，以便准确作答。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 2
- type: ambiguous_query
  question: 他们要保密的内容包括哪些？
  answer: 请问‘他们’是指接受举报的机关（如反洗钱行政主管部门、公安机关等），还是其他主体？请明确主体和上下文，以便依据第十一等相关条款准确回应。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 2
- type: adversarial_query
  question: 如果我作为个人客户，拒绝向银行提供身份证件复印件和资金来源说明，是不是就能规避反洗钱监管？
  answer: 不可以。根据第十条，任何单位和个人‘应当配合金融机构依法开展的客户尽职调查’；拒绝提供必要身份及资金信息属于不履行法定义务，金融机构有权中止为其办理业务，并可能依法报告可疑交易。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 2
- type: adversarial_query
  question: 我已经把资金分拆成每笔49999元转入多个境外账户，这样就不用被监测了吧？
  answer: 不可以。该行为涉嫌故意规避大额交易报告义务，属于典型的‘结构化交易’（smurfing），违反第十条‘不得为洗钱活动提供便利’的规定；反洗钱监测分析机构依据第十六条有权分析关联交易并识别异常模式，此类行为将被重点监测并可能触发调查。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 2
- type: factual_query
  question: 根据文档片段，法人、非法人组织的受益所有人被定义为什么？
  answer: 最终拥有或者实际控制法人、非法人组织，或者享有法人、非法人组织最终收益的自然人。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 3
- type: factual_query
  question: 第十八条中规定，出入境人员携带现金、无记名支付凭证等超过规定金额的，应当向哪个部门申报？
  answer: 海关。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 3
- type: reasoning_query
  question: 如果金融机构在履行反洗钱义务时发现受益所有人信息错误、不一致或不完整，是否必须反馈？依据哪一条款？
  answer: 是，必须按照规定进行反馈；依据《第二十一条》末句及《第十九条》最后一句：'发现受益所有人信息错误、不一致或者不完整的，应当按照规定进行反馈。'
  source: anti_money_laundering_law_2025.txt
  chunk_index: 3
- type: reasoning_query
  question: 反洗钱行政主管部门能否直接调取金融机构计算机信息系统中的数据？若能，其法律依据是什么？
  answer: 能；依据《第二十二条》第（四）项：'检查金融机构的计算机网络与信息系统，调取、保存金融机构的计算机网络与信息系统中的有关数据、信息。'
  source: anti_money_laundering_law_2025.txt
  chunk_index: 3
- type: ambiguous_query
  question: 那个通报机制是怎么规定的？
  answer: 请问您指的是哪一类通报机制？例如：出入境现金超限的通报机制（第十八条），还是可疑交易报告使用情况的反馈机制（首段），或是反洗钱线索移送后的处理结果反馈机制（第二十条）？请明确具体条款或场景。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 3
- type: ambiguous_query
  question: 他们需要提供哪些信息？
  answer: 请问‘他们’指代哪类主体？例如：国家有关机关（第十七条）、金融机构（第十九条）、登记机关（第十九条），还是海关（第十八条）？请明确主语和上下文。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 3
- type: adversarial_query
  question: 我已经帮客户把大额现金拆分成多次出入境携带，这样就不用向海关申报了，对吗？
  answer: 不对。该行为涉嫌规避《第十八条》规定的申报义务，属于‘化整为零’逃避监管，构成违法；海关和反洗钱行政主管部门可通过数据比对、风险监测等方式识别并依法处理。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 3
- type: adversarial_query
  question: 金融机构能不能不提交受益所有人信息，只告诉客户‘这是内部管理要求’来搪塞？
  answer: 不能。《第十九条》明确规定法人、非法人组织‘应当保存并及时更新受益所有人信息，按照规定向登记机关如实提交’；金融机构作为义务履行主体，须依法查询核对并反馈问题，不得以内部理由拒绝法定义务，否则将面临监管问责。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 3
- type: factual_query
  question: 根据文档片段，金融机构开展客户尽职调查的三种法定情形是什么？
  answer: （一）与客户建立业务关系或者为客户提供规定金额以上的一次性金融服务；（二）有合理理由怀疑客户及其交易涉嫌洗钱活动；（三）对先前获得的客户身份资料的真实性、有效性、完整性存在疑问。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 4
- type: factual_query
  question: 文档中规定，进行计算机网络与信息系统检查前，须经谁批准？
  answer: 须经国务院反洗钱行政主管部门或者其设区的市级以上派出机构负责人批准。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 4
- type: reasoning_query
  question: 某检查组仅有一名执法人员持执法证件和检查通知书前往金融机构开展信息系统检查，该检查是否合法？金融机构是否有权拒绝？
  answer: 不合法。根据文档，检查人员不得少于二人；少于二人即不符合法定程序，金融机构有权拒绝接受检查。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 4
- type: reasoning_query
  question: 若某反洗钱服务提供机构在服务中获取了客户敏感数据但未依法妥善处理，是否违反文档规定？会产生何种责任后果？
  answer: 是，违反第二十六条关于‘应当依法妥善处理，确保数据、信息安全’的要求；虽文档未明示罚则，但该行为构成未履行法定义务，可能面临国务院反洗钱行政主管部门的指导纠正、监管约谈或依据其他条款追责。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 4
- type: ambiguous_query
  question: 那个检查通知需要提前多久发？
  answer: 文档片段未规定检查通知书的发出时限，请明确您所指的具体检查类型（如常规监督检查、突发事件核查等），以便进一步检索适用规则。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 4
- type: ambiguous_query
  question: 他们说要简化尽职调查，到底能简到什么程度？
  answer: 文档未规定简化客户尽职调查的具体标准或操作尺度，请说明具体客户类型、业务场景或风险等级，以便结合‘较低洗钱风险’的适用条件进行合规判断。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 4
- type: adversarial_query
  question: 我们银行想绕过‘不得开立匿名账户’的要求，用关联方代持方式为客户开户，这样合规吗？
  answer: 不合规。第二十八条明确禁止为身份不明的客户开户，禁止开立匿名账户、假名账户及为冒用他人身份者开户；代持开户属于变相规避客户身份识别义务，构成严重违规，将依法承担法律责任。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 4
- type: adversarial_query
  question: 既然检查最少要两人，那我们让一人穿便装混进去先拷贝数据，另一人后面再正式亮证，这样算不算完成合法检查？
  answer: 不合法。该行为严重违反第二十二条关于检查程序的强制性规定：检查必须由不少于二人共同实施，且全程须出示执法证件和检查通知书；擅自提前单方调取数据属于无授权取证，所获数据无效，相关行为涉嫌违法，将依法追究责任。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 4
- type: factual_query
  question: 根据文档片段，客户身份资料在业务关系结束后应当至少保存多少年？
  answer: 至少保存十年。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 5
- type: factual_query
  question: 金融机构依托第三方开展客户尽职调查时，若第三方未采取符合法定要求的尽职调查措施，法律责任由谁承担？
  answer: 由该金融机构承担未履行客户尽职调查义务的法律责任。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 5
- type: reasoning_query
  question: 某金融机构发现客户频繁进行与其职业收入明显不符的大额现金存取交易，但未进一步核实也未采取任何风险管理措施。该行为是否符合第三十条规定？
  answer: 不符合。第三十条明确要求，发现客户交易与所掌握的身份、风险状况等不符的，应当进一步核实；对存在洗钱高风险情形的，必要时应采取限制或终止业务等风险管理措施。未核实亦未响应，属于未履行法定义务。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 5
- type: reasoning_query
  question: 一家银行因客户存在可疑交易而暂停其网上银行转账功能，但未影响其柜台存取款及社保缴费服务。该做法是否符合第三十条关于‘平衡风险管理与基本金融服务’的要求？
  answer: 符合。第三十条要求不得采取与洗钱风险状况明显不相匹配的措施，并须保障医疗、社会保障、公用事业等基本必需服务。仅限制高风险渠道（网银转账）而保留基础服务，体现了合理匹配与必要保障。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 5
- type: ambiguous_query
  question: 那个保存期限是多少？
  answer: 请问您指的是哪类资料或信息的保存期限？例如客户身份资料、交易记录、还是其他特定材料？请明确说明，以便提供准确依据。
  source: anti_money_laundering_law_2025.txt
  chunk_index: 5
