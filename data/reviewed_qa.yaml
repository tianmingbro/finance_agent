- answer: 为了预防洗钱活动，遏制洗钱以及相关犯罪，加强和规范反洗钱工作，维护金融秩序、社会公共利益和国家安全。
  category: factual_query
  chunk_index: 1
  difficulty: easy
  question: 反洗钱法的立法目的是什么？
  source: anti_money_laundering_law_2025.txt
- answer: 在中华人民共和国境内设立的金融机构和依照本法规定应当履行反洗钱义务的特定非金融机构。
  category: factual_query
  chunk_index: 1
  difficulty: easy
  question: 哪些机构需要履行反洗钱义务？
  source: anti_money_laundering_law_2025.txt
- answer: 是的，对依法履行反洗钱职责或者义务获得的客户身份资料和交易信息、反洗钱调查信息等，应当予以保密；非依法律规定，不得向任何单位和个人提供。
  category: factual_query
  chunk_index: 1
  difficulty: easy
  question: 反洗钱信息是否需要保密？
  source: anti_money_laundering_law_2025.txt
- answer: 反洗钱工作应当依法进行，确保反洗钱措施与洗钱风险相适应，保障正常金融服务和资金流转顺利进行，维护单位和个人的合法权益。
  category: factual_query
  chunk_index: 1
  difficulty: easy
  question: 反洗钱工作应当遵循哪些基本原则？
  source: anti_money_laundering_law_2025.txt
- answer: 国务院反洗钱行政主管部门负责全国的反洗钱监督管理工作。
  category: factual_query
  chunk_index: 1
  difficulty: easy
  question: 谁负责全国的反洗钱监督管理工作？
  source: anti_money_laundering_law_2025.txt
- answer: 任何单位和个人发现洗钱活动，有权向反洗钱行政主管部门、公安机关或者其他有关国家机关举报。接受举报的机关应当对举报人和举报内容保密。
  category: factual_query
  chunk_index: 2
  difficulty: easy
  question: 普通老百姓发现有人洗钱，应该向谁举报？
  source: anti_money_laundering_law_2025.txt
- answer: 国务院有关金融管理部门在监督管理工作中发现金融机构违反反洗钱规定的，应当将线索移送反洗钱行政主管部门，并配合其进行处理。
  category: factual_query
  chunk_index: 2
  difficulty: easy
  question: 金融机构不配合反洗钱监管会有什么后果？
  source: anti_money_laundering_law_2025.txt
- answer: 反洗钱监测分析机构开展反洗钱资金监测，负责接收、分析大额交易和可疑交易报告，移送分析结果，并向国务院反洗钱行政主管部门报告工作情况；还可要求义务机构提供补充信息，反馈可疑交易报告使用情况。
  category: factual_query
  chunk_index: 2
  difficulty: easy
  question: 反洗钱监测分析机构的主要职责有哪些？
  source: anti_money_laundering_law_2025.txt
- answer: 在中华人民共和国境外的洗钱和恐怖主义融资活动，如危害中国主权和安全、侵犯中国公民或组织合法权益，或者扰乱境内金融秩序的，依照本法及相关法律规定处理并追究法律责任。
  category: factual_query
  chunk_index: 2
  difficulty: medium
  question: 境外发生的洗钱活动，中国法律管不管？
  source: anti_money_laundering_law_2025.txt
- answer: 任何单位和个人不得从事洗钱活动或者为洗钱活动提供便利，并应当配合金融机构和特定非金融机构依法开展的客户尽职调查。
  category: factual_query
  chunk_index: 2
  difficulty: easy
  question: 单位或个人如果不配合金融机构的客户尽职调查，违法吗？
  source: anti_money_laundering_law_2025.txt
- answer: 国务院反洗钱行政主管部门为履行反洗钱职责，可以从国家有关机关获取所必需的信息，国家有关机关应当依法提供。
  category: factual_query
  chunk_index: 3
  difficulty: easy
  question: 反洗钱行政主管部门可以向哪些机关获取信息？
  source: anti_money_laundering_law_2025.txt
- answer: 是的，出入境人员携带的现金、无记名支付凭证等超过规定金额的，应当按照规定向海关申报。
  category: factual_query
  chunk_index: 3
  difficulty: easy
  question: 出入境人员携带现金超过规定金额需要申报吗？
  source: anti_money_laundering_law_2025.txt
- answer: 法人、非法人组织应当保存并及时更新受益所有人信息，按照规定向登记机关如实提交并及时更新受益所有人信息。
  category: factual_query
  chunk_index: 3
  difficulty: easy
  question: 受益所有人信息由谁负责保存和更新？
  source: anti_money_laundering_law_2025.txt
- answer: 可以进入金融机构进行检查；询问工作人员并要求说明；查阅、复制相关文件资料并封存可能被转移、隐匿或毁损的资料；检查计算机网络与信息系统，调取、保存相关数据信息。
  category: factual_query
  chunk_index: 3
  difficulty: easy
  question: 反洗钱行政主管部门监督检查时可以采取哪些措施？
  source: anti_money_laundering_law_2025.txt
- answer: 应当将线索和相关证据材料移送有管辖权的机关处理；接受移送的机关应当按照有关规定反馈处理结果。
  category: factual_query
  chunk_index: 3
  difficulty: easy
  question: 发现涉嫌洗钱交易活动后，反洗钱行政主管部门应如何处理？
  source: anti_money_laundering_law_2025.txt
- answer: 检查人员不得少于二人。少于二人的，金融机构有权拒绝接受检查。
  category: factual_query
  chunk_index: 4
  difficulty: easy
  question: 反洗钱检查人员去金融机构检查时，最少需要几个人？
  source: anti_money_laundering_law_2025.txt
- answer: 有下列情形之一的，金融机构应当开展客户尽职调查：（一）与客户建立业务关系或者为客户提供规定金额以上的一次性金融服务；（二）有合理理由怀疑客户及其交易涉嫌洗钱活动；（三）对先前获得的客户身份资料的真实性、有效性、完整性存在疑问。
  category: factual_query
  chunk_index: 4
  difficulty: easy
  question: 金融机构在什么情况下必须开展客户尽职调查？
  source: anti_money_laundering_law_2025.txt
- answer: 金融机构的负责人对反洗钱内部控制制度的有效实施负责。
  category: factual_query
  chunk_index: 4
  difficulty: easy
  question: 金融机构负责人对反洗钱工作要承担什么责任？
  source: anti_money_laundering_law_2025.txt
- answer: 不能。金融机构不得为客户开立匿名账户或者假名账户，也不得为身份不明或冒用他人身份的客户提供服务或与其进行交易。
  category: factual_query
  chunk_index: 4
  difficulty: easy
  question: 金融机构能否为客户开立匿名账户？
  source: anti_money_laundering_law_2025.txt
- answer: 应当经国务院反洗钱行政主管部门或者其设区的市级以上派出机构负责人批准。
  category: factual_query
  chunk_index: 4
  difficulty: easy
  question: 反洗钱行政主管部门检查金融机构信息系统前，需要履行什么审批程序？
  source: anti_money_laundering_law_2025.txt
- answer: 对于涉及较低洗钱风险的客户，金融机构可以根据情况简化客户尽职调查。
  category: factual_query
  chunk_index: 5
  difficulty: easy
  question: 金融机构在什么情况下可以简化客户尽职调查？
  source: anti_money_laundering_law_2025.txt
- answer: 应当进一步核实客户及其交易有关情况；对存在洗钱高风险情形的，必要时可采取限制交易、限制业务类型、拒绝办理业务或终止业务关系等风险管理措施。
  category: factual_query
  chunk_index: 5
  difficulty: easy
  question: 如果客户交易与已知身份或风险状况不符，金融机构该怎么办？
  source: anti_money_laundering_law_2025.txt
- answer: 应当评估第三方的风险状况及其履行反洗钱义务的能力；第三方不得具有较高风险情形或不具备履行反洗钱义务能力；且必须确保第三方已采取符合本法要求的客户尽职调查措施。
  category: factual_query
  chunk_index: 5
  difficulty: medium
  question: 金融机构依托第三方开展客户尽职调查，需要满足哪些前提条件？
  source: anti_money_laundering_law_2025.txt
- answer: 客户身份资料在业务关系结束后、客户交易信息在交易结束后，应当至少保存十年。
  category: factual_query
  chunk_index: 5
  difficulty: easy
  question: 客户身份资料和交易记录要保存多久？
  source: anti_money_laundering_law_2025.txt
- answer: 不得采取与洗钱风险状况明显不相匹配的措施，应保障客户依法享有的医疗、社会保障、公用事业服务等相关的基本的、必需的金融服务。
  category: factual_query
  chunk_index: 5
  difficulty: easy
  question: 金融机构是否可以拒绝为高风险客户提供基本金融服务？
  source: anti_money_laundering_law_2025.txt
- answer: 金融机构应当及时向反洗钱监测分析机构提交可疑交易报告；提交可疑交易报告的情况应当保密。
  category: factual_query
  chunk_index: 6
  difficulty: easy
  question: 金融机构发现可疑交易后，应该怎么做？
  source: anti_money_laundering_law_2025.txt
- answer: 应当在总部或者集团层面统筹安排反洗钱工作。
  category: factual_query
  chunk_index: 6
  difficulty: easy
  question: 金融机构在境内外设有分支机构或控股其他金融机构的，反洗钱工作由谁统筹安排？
  source: anti_money_laundering_law_2025.txt
- answer: 金融机构可以采取限制或者拒绝办理业务、终止业务关系等洗钱风险管理措施，并根据情况提交可疑交易报告。
  category: factual_query
  chunk_index: 6
  difficulty: easy
  question: 单位和个人不配合金融机构客户尽职调查，金融机构可以采取哪些措施？
  source: anti_money_laundering_law_2025.txt
- answer: 可以向金融机构提出，金融机构应在十五日内处理并答复；逾期未收到答复或对结果不满意，可向反洗钱行政主管部门投诉，也可依法直接向人民法院提起诉讼。
  category: factual_query
  chunk_index: 6
  difficulty: easy
  question: 如果对金融机构采取的洗钱风险管理措施有异议，该怎么办？
  source: anti_money_laundering_law_2025.txt
- answer: 可以：对第一项名单可依《反恐怖主义法》申请复核；对第二项名单可申请从名单中除去；对第三项名单可申请行政复议，不服复议决定的可依法提起行政诉讼。
  category: factual_query
  chunk_index: 6
  difficulty: medium
  question: 对反洗钱特别预防措施所涉名单有异议，能否申请复核或救济？
  source: anti_money_laundering_law_2025.txt
- answer: 包括立即停止向名单所列对象及其代理人、受其指使的组织和人员、其直接或者间接控制的组织提供金融等服务或者资金、资产，以及立即限制相关资金、资产转移等。
  category: factual_query
  chunk_index: 7
  difficulty: easy
  question: 反洗钱特别预防措施包括哪些具体内容？
  source: anti_money_laundering_law_2025.txt
- answer: 可以按照规定向国家有关机关申请使用被限制的资金、资产用于单位和个人的基本开支及其他必需支付的费用。
  category: factual_query
  chunk_index: 7
  difficulty: easy
  question: 被采取反洗钱特别预防措施的单位或个人，能否申请使用被限制的资金、资产？
  source: anti_money_laundering_law_2025.txt
- answer: 应当识别、评估相关风险并制定相应制度，及时获取法定名单，对客户及其交易对象进行核查，采取相应措施，并向反洗钱行政主管部门报告。
  category: factual_query
  chunk_index: 7
  difficulty: easy
  question: 金融机构在反洗钱工作中需要履行哪些义务？
  source: anti_money_laundering_law_2025.txt
- answer: 调查人员不得少于二人，并应当出示执法证件和调查通知书；少于二人或未出示证件和通知书的，金融机构、特定非金融机构有权拒绝接受调查。
  category: factual_query
  chunk_index: 7
  difficulty: easy
  question: 反洗钱调查中，调查人员最少几人可以开展调查？是否必须出示证件？
  source: anti_money_laundering_law_2025.txt
- answer: 国务院反洗钱行政主管部门认为必要时，经其负责人批准，可以采取临时冻结措施。
  category: factual_query
  chunk_index: 7
  difficulty: easy
  question: 反洗钱行政主管部门在调查中发现客户转移涉案账户资金，能否冻结？
  source: anti_money_laundering_law_2025.txt
- answer: 可以。客户转移调查所涉及的账户资金的，国务院反洗钱行政主管部门认为必要时，经其负责人批准，可以采取临时冻结措施。
  category: factual_query
  chunk_index: 8
  difficulty: easy
  question: 国务院反洗钱行政主管部门可以对涉嫌洗钱的账户资金采取临时冻结措施吗？
  source: anti_money_laundering_law_2025.txt
- answer: 临时冻结不得超过四十八小时。金融机构在按照国务院反洗钱行政主管部门的要求采取临时冻结措施后四十八小时内，未接到国家有关机关继续冻结通知的，应当立即解除冻结。
  category: factual_query
  chunk_index: 8
  difficulty: easy
  question: 临时冻结措施最长可以持续多长时间？
  source: anti_money_laundering_law_2025.txt
- answer: 接受移送的机关认为不需要继续冻结的，应当立即通知国务院反洗钱行政主管部门，国务院反洗钱行政主管部门应当立即通知金融机构解除冻结。
  category: factual_query
  chunk_index: 8
  difficulty: easy
  question: 如果接受移送的机关认为不需要继续冻结，应该怎么办？
  source: anti_money_laundering_law_2025.txt
- answer: 不能。外国国家、组织违反对等、协商一致原则直接要求境内金融机构扣押、冻结、划转境内资金、资产的，金融机构不得擅自执行，并应当及时向国务院有关金融管理部门报告。
  category: factual_query
  chunk_index: 8
  difficulty: easy
  question: 境外机构直接要求境内金融机构扣押、冻结境内资金，金融机构能照办吗？
  source: anti_money_laundering_law_2025.txt
- answer: 反洗钱行政主管部门和其他依法负有反洗钱监督管理职责的部门从事反洗钱工作的人员泄露因反洗钱知悉的个人隐私、个人信息的，依法给予处分。
  category: factual_query
  chunk_index: 8
  difficulty: easy
  question: 反洗钱工作人员泄露因工作知悉的个人信息，会有什么后果？
  source: anti_money_laundering_law_2025.txt
- answer: 属于第五十二条第（一）项情形，由国务院反洗钱行政主管部门或其设区的市级以上派出机构责令限期改正，可以给予警告或者处二十万元以下罚款；情节严重或者逾期未改正的，处二十万元以上二百万元以下罚款。
  category: factual_query
  chunk_index: 9
  difficulty: easy
  question: 金融机构没制定反洗钱内部控制制度，会受到什么处罚？
  source: anti_money_laundering_law_2025.txt
- answer: 属于第五十三条第（四）项情形，由国务院反洗钱行政主管部门或其设区的市级以上派出机构责令限期改正，可以给予警告或者处二十万元以下罚款；情节严重或者逾期未改正的，处二十万元以上二百万元以下罚款。
  category: factual_query
  chunk_index: 9
  difficulty: easy
  question: 金融机构未按规定报告可疑交易，会被怎么罚？
  source: anti_money_laundering_law_2025.txt
- answer: 属于第五十四条第（一）项情形，由国务院反洗钱行政主管部门或其设区的市级以上派出机构责令限期改正，处五十万元以下罚款；情节严重的，处五十万元以上五百万元以下罚款，并可建议限制或禁止其开展相关业务。
  category: factual_query
  chunk_index: 9
  difficulty: easy
  question: 金融机构为身份不明的客户开立账户，会面临哪些处罚？
  source: anti_money_laundering_law_2025.txt
- answer: 是的，属于第五十二条第（九）项情形，将被责令限期改正，可以给予警告或者处二十万元以下罚款；情节严重或者逾期未改正的，处二十万元以上二百万元以下罚款。
  category: factual_query
  chunk_index: 9
  difficulty: easy
  question: 金融机构负责人没履行好反洗钱职责，会被处罚吗？
  source: anti_money_laundering_law_2025.txt
- answer: 该行为同时违反第五十三条第（三）项及第五十五条适用前提，致使犯罪所得得以掩饰、隐瞒的，涉及金额不足一千万元的，处五十万元以上一千万元以下罚款；涉及金额一千万元以上的，处涉及金额百分之二十以上二倍以下罚款。
  category: factual_query
  chunk_index: 9
  difficulty: medium
  question: 如果金融机构因未报告大额交易导致犯罪所得被掩饰，会怎么处罚？
  source: anti_money_laundering_law_2025.txt
- answer: 对负有责任的董事、监事、高级管理人员或者其他直接责任人员，可处二十万元以上一百万元以下罚款；情节严重的，还可取消任职资格或禁止从事金融行业工作。
  category: factual_query
  chunk_index: 10
  difficulty: easy
  question: 金融机构高管被处罚时，罚款金额范围是多少？
  source: anti_money_laundering_law_2025.txt
- answer: 可以不予处罚。前两款规定的金融机构董事、监事、高级管理人员或者其他直接责任人员能够证明自己已经勤勉尽责采取反洗钱措施的，可以不予处罚。
  category: factual_query
  chunk_index: 10
