# tests/promptfoo_tests.yaml
# Promptfoo 测试配置：跨模型对比 & 安全红队用例
# 包含三类 Prompt 模板：直接回答、RAG 增强、安全边界


# ========== 事实查询（直接回答）10 条 ==========
- prompt: 0
  vars:
    query: "商业银行的核心一级资本充足率要求是多少？"
    expected_keywords: "不低于5%"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
    - type: not-contains
      value: "无法回答"
- prompt: 0
  vars:
    query: "存款保险最高偿付限额是多少？"
    expected_keywords: "50万元"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
- prompt: 0
  vars:
    query: "个人每年便利化购汇额度是多少？"
    expected_keywords: "5万美元"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
- prompt: 0
  vars:
    query: "LPR最新报价1年期是多少？"
    expected_keywords: "3.0%"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
- prompt: 0
  vars:
    query: "资本充足率监管指标有哪几个？"
    expected_keywords: "核心一级资本充足率"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
- prompt: 0
  vars:
    query: "反洗钱法规定的客户尽职调查是什么？"
    expected_keywords: "身份识别"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
- prompt: 0
  vars:
    query: "存款保险条例的立法目的是什么？"
    expected_keywords: "保护存款人"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
- prompt: 0
  vars:
    query: "什么是系统重要性银行？"
    expected_keywords: "附加资本要求"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
- prompt: 0
  vars:
    query: "外汇业务中经常项目和资本项目的区别？"
    expected_keywords: "资本项目"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
- prompt: 0
  vars:
    query: "资本充足率不达标的银行有什么后果？"
    expected_keywords: "监管措施"
  assert:
    - type: contains
      value: "{{expected_keywords}}"

# ========== 推理查询（RAG 增强回答）5 条 ==========
- prompt: 1
  vars:
    query: "如果银行核心一级资本充足率只有4.5%，是否合规？"
    context: |
      根据《商业银行资本管理办法》，核心一级资本充足率不得低于5%。
      未达标的银行将面临监管限制。
    expected_keywords: "不合规"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
- prompt: 1
  vars:
    query: "用满便利化额度后还能继续购汇吗？"
    context: |
      个人年度便利化额度为等值5万美元。超过额度需提供真实合规的用途证明。
    expected_keywords: "需提供证明材料"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
- prompt: 1
  vars:
    query: "存款保险50万限额是每家银行分别计算吗？"
    context: |
      《存款保险条例》规定，最高偿付限额为人民币50万元，同一存款人在同一家投保机构所有被保险存款账户合并计算。
    expected_keywords: "同一家机构合并计算"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
- prompt: 1
  vars:
    query: "LPR下降对房贷借款人有什么影响？"
    context: |
      LPR下调后，以LPR为定价基准的浮动利率房贷，重定价日之后月供将减少。
    expected_keywords: "月供减少"
  assert:
    - type: contains
      value: "{{expected_keywords}}"
- prompt: 1
  vars:
    query: "资本充足率计算中风险加权资产包括哪些？"
    context: |
      风险加权资产包括信用风险、市场风险和操作风险对应的加权资产，具体权重由监管规定。
    expected_keywords: "信用风险"
  assert:
    - type: contains
      value: "{{expected_keywords}}"

