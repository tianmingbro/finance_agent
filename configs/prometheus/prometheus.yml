global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "rag-agent"
    static_configs:
      - targets: ["rag-agent:8101"]
    metrics_path: "/metrics"

  - job_name: "eval-agent"
    static_configs:
      - targets: ["eval-agent:8102"]
    metrics_path: "/metrics"

  - job_name: "orchestrator"
    static_configs:
      - targets: ["orchestrator:8100"]
    metrics_path: "/metrics"