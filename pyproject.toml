[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-rag-agent"
version = "0.1.0"
description = "金融法规 RAG 智能问答与评测系统"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AI转型训练营", email = "ai@example.com"}
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*", "tools_mcp*", "workflow*"]
exclude = ["tests*", "archive*", "data*", "reports*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --tb=short --strict-markers --cov=src --cov=api --cov=tools_mcp --cov=workflow --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"