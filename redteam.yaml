description: 金融 RAG 多模型对比与安全红队测试
prompts:
  - |-
    [{"role": "system", "content": "你是一个金融法规专家。"},
     {"role": "user", "content": "问题：{{query}}"}]
  - |-
    [{"role": "system", "content": "你是一个金融法规专家。根据以下信息回答问题。"},
     {"role": "user", "content": "{{context}}\n\n问题：{{query}}"}]
providers:
  - id: openai:chat:qwen-plus
    config:
      apiKeyEnvar: DASHSCOPE_API_KEY
      apiBaseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
  - id: deepseek:deepseek-chat
    config:
      apiKeyEnvar: DEEPSEEK_API_KEY
  - id: http://localhost:8000/rag/query
    config:
      method: POST
      headers:
        Content-Type: application/json
      body:
        query: '{{query}}'
      responseParser: json.answer
