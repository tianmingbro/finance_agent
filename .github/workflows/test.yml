name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      pgvector:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: pgvector
          POSTGRES_PASSWORD: pgvector
          POSTGRES_DB: ai_rag
        options: >-
          --health-cmd "pg_isready -U pgvector -d ai_rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}      # DeepEval / LangChain 兼容性
      OPENAI_API_BASE: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      REDIS_URL: "redis://redis:6379"
      PGVECTOR_CONNECTION_STRING: "postgresql+psycopg3://pgvector:pgvector@pgvector:5432/ai_rag"
      VECTOR_BACKEND: chroma   # 默认使用 Chroma，也可切换为 pgvector

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Prepare knowledge base (if needed)
        run: |
          # 如果向量库需要预置数据，可运行数据导入脚本
          python ingest_data.py --input data/source_docs --backend chroma || true

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false