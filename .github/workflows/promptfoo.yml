name: Promptfoo Evaluation & Redteam

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'promptfooconfig.yaml'
      - 'tests/promptfoo/**'
      - 'configs/promptfoo/**'
      - 'api/**'
      - 'workflow.py'
      - 'tools_mcp.py'

jobs:
  promptfoo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Promptfoo evaluation (non-redteam)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          npx promptfoo@latest eval -c promptfooconfig.yaml --output reports/promptfoo/ci_report.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-reports
          path: reports/promptfoo/